name = "hessa-gateway"
main = "src/worker.js"
compatibility_date = "2025-01-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "hessa"
database_id = "REPLACE-WITH-THE-ID-FROM-wrangler-d1-create"

[triggers]
crons = ["17 3 * * *"]


# Secret (never written in this file):  npx wrangler secret put OFFICE_SECRET
