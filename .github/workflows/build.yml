# Tests on every change, and builds the Windows installer Hessa-Setup-<version>.exe.
# Explicit version tags publish an installer; merging development work does not publish a release.
# See docs/BUILD_AND_RELEASE.md.
name: Test and build

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the upgrade tests rebuild the first version of the program from the history
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python lint
        run: |
          python -m pip install pyflakes
          python -m pyflakes server tools tests
      - name: Installer files present (fails in seconds instead of at the end of a Windows build)
        run: python tools/build_windows.py --check
      - name: Frontend startup and centre flows
        run: node --test tests/test_frontend.js
      - name: Gateway tests (Worker + D1 stand-in)
        working-directory: gateway
        run: node --test --no-warnings test/gateway.test.js
      - name: Office tests (engine, centre, Excel, samples and two PCs)
        working-directory: tests
        run: python -m unittest test_unit test_convergence test_design test_ci test_center_domain test_center_api test_center_multinode test_center_network test_center_domain_remote test_center_api_remote test_center_multinode_remote test_center_join test_center_devices test_center_safety test_center_gateway test_center_links test_center_review test_center_remote test_gateway_parent test_multinode test_sample test_xlsx

  browser:
    # the screens in a real browser (Chromium of the runner): the core journeys, both languages, the parent page and phones
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Playwright (driver only; the browser is the runner's Chrome)
        run: python -m pip install playwright
      - name: Browser tests
        working-directory: tests
        env:
          HS_CHROMIUM: /usr/bin/google-chrome
        run: |
          python -c "import os, sys; sys.exit(0 if os.path.exists(os.environ['HS_CHROMIUM']) else 'Chrome is missing on the runner')"
          python -m unittest test_e2e_browser test_e2e_center test_center_review test_center_links test_gateway_parent test_acceptance

  windows-installer:
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "nuitka>=2.4,<3" ordered-set zstandard
          choco upgrade innosetup -y --no-progress
      - name: Build Hessa.exe and the installer
        run: python tools/build_windows.py
      - name: Check that the built program starts and serves its pages
        shell: pwsh
        run: |
          $home_dir = Join-Path $env:RUNNER_TEMP 'hs-home'
          New-Item -ItemType Directory -Force $home_dir | Out-Null
          '{"port": 18080, "sync_port": 18443, "open_browser": false}' | Set-Content (Join-Path $home_dir 'config.json')
          $env:HS_HOME = $home_dir
          $p = Start-Process -FilePath build\hs_main.dist\Hessa.exe -ArgumentList '--background' -WindowStyle Hidden -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60 -and -not $ok; $i++) {
            Start-Sleep -Seconds 1
            try {
              $s = Invoke-RestMethod http://127.0.0.1:18080/api/auth/status
              $page = (Invoke-WebRequest http://127.0.0.1:18080/ -UseBasicParsing).Content
              $js = (Invoke-WebRequest http://127.0.0.1:18080/js/app.js -UseBasicParsing).StatusCode
              if ($s.about.installed -and $page -match 'Hessa' -and $js -eq 200) { $ok = $true }
            } catch { }
          }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { Get-Content (Join-Path $home_dir 'data\logs\server.log') -ErrorAction SilentlyContinue; throw 'Hessa.exe did not start correctly' }
          if (-not (Test-Path (Join-Path $home_dir 'data\auth.db'))) { throw 'data was not written to HS_HOME' }
          Write-Host 'Hessa.exe started and served its pages'
      - uses: actions/upload-artifact@v4
        with:
          name: Hessa-Setup
          path: dist/Hessa-Setup-*.exe
          retention-days: 30
      - name: Publish an explicitly tagged release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(python -c "import sys; sys.path.insert(0, 'server'); from version import VERSION; print(VERSION)")
          if gh release view "v$v" > /dev/null 2>&1; then
            echo "Release v$v already exists - raise VERSION in server/version.py to publish a new one."
            exit 0
          fi
          gh release create "v$v" dist/Hessa-Setup-*.exe --target "$GITHUB_SHA" \
            --title "Hessa $v" --notes-file docs/RELEASE_NOTES.md
          gh release upload "v$v" gateway/dist/hessa-gateway.js gateway/dist/schema.sql docs/GATEWAY_SETUP.md --clobber
